<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e41d2d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AIM CG" />
    <meta name="description" content="AIM job scheduling and employee field updates." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <title>AIM CG</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__aimBootError = null;
      window.addEventListener("error", event => {
        window.__aimBootError = event.error?.message || event.message || "Unknown startup error";
      });
      window.addEventListener("unhandledrejection", event => {
        window.__aimBootError = event.reason?.message || String(event.reason || "Unknown startup rejection");
      });
      window.setTimeout(() => {
        const root = document.getElementById("root");
        if (root && !root.hasChildNodes()) {
          root.innerHTML = `<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui;background:#f4f6f8"><section style="max-width:620px;background:white;border:1px solid #d8dee8;border-radius:18px;padding:22px"><h1 style="margin-top:0">AIM CG did not start</h1><p>${window.__aimBootError || "The browser did not load the application JavaScript."}</p><p>Refresh the page once. If it remains here, open the browser console and copy the first red error.</p><button onclick="location.reload()" style="border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:#18202a;color:white">Reload app</button></section></main>`;
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
